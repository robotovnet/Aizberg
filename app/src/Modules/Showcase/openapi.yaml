openapi: 3.0.3

info:
  title: Aizberg Showcase API
  version: 1.0.0
  description: |
    REST API модуля Showcase — каталог примеров сайтов на Aizberg с категориями,
    изображениями, списком использованных модулей и модерацией.

    Все маршруты имеют базовый префикс `/api/showcase`.

    Защищённые операции используют клиентскую сессию Laravel (`auth:client`).
    Модератором считается клиент, присутствующий в таблице
    `showcase_moderator_permissions`.

    Новые примеры создаются со статусом `pending`. Публичные операции возвращают
    только примеры со статусом `approved`. Автор может редактировать собственный
    пример только в статусах `pending` и `rejected`; после любого успешного
    обновления автором (в том числе с пустым телом) статус снова становится `pending`.

    Все списки примеров отсортированы по `created_at` от новых к старым.

    Все успешные операции текущей реализации возвращают HTTP 200. Ошибки
    бизнес-логики, включая отсутствие сущности и недостаток прикладных прав,
    возвращаются с HTTP 400. Для JSON-ответа 401 при отсутствии сессии
    передавайте `Accept: application/json`.

    PHP не разбирает `multipart/form-data` в PATCH-запросах. Для загрузки файлов
    в операциях обновления отправляйте `POST` с полем `_method=PATCH`
    (подмена метода Laravel).

    Маршруты Showcase исключены из CSRF-проверки, поэтому заголовки
    `X-CSRF-TOKEN` и `X-XSRF-TOKEN` для них не требуются.
  contact:
    name: Aizberg

servers:
  - url: /api/showcase
    description: Относительный URL API модуля Showcase

tags:
  - name: Categories
    description: Категории проектов
  - name: Examples
    description: Публичный каталог утверждённых примеров
  - name: My examples
    description: Примеры текущего авторизованного клиента
  - name: Moderation
    description: Операции модератора Showcase

paths:
  /categories:
    get:
      tags:
        - Categories
      summary: Получить список категорий
      description: Категории отсортированы по `sort_order`, затем по `name`.
      operationId: showcaseListCategories
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'

    post:
      tags:
        - Categories
      summary: Создать категорию
      description: |
        Доступно только модератору. Если `slug` отсутствует, пуст или равен
        `null`, уникальный slug генерируется из `name`.
      operationId: showcaseCreateCategory
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCategoryRequest'
      responses:
        '200':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'

    get:
      tags:
        - Categories
      summary: Получить категорию
      operationId: showcaseGetCategory
      responses:
        '200':
          description: Категория найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    patch:
      tags:
        - Categories
      summary: Обновить категорию
      description: Доступно только модератору. Пустое тело является допустимым no-op запросом.
      operationId: showcaseUpdateCategory
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Categories
      summary: Удалить категорию
      description: |
        Доступно только модератору. Категорию нельзя удалить, пока в ней есть
        хотя бы один пример сайта.
      operationId: showcaseDeleteCategory
      security:
        - clientSession: []
      responses:
        '200':
          description: Категория удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories/{id}/examples:
    get:
      tags:
        - Examples
      summary: Получить примеры из категории
      description: |
        Возвращает только примеры со статусом `approved`, от новых к старым.
        Для несуществующей категории возвращается ошибка 400.
      operationId: showcaseListExamplesByCategory
      parameters:
        - $ref: '#/components/parameters/CategoryId'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница примеров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplesPaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /modules:
    get:
      tags:
        - Examples
      summary: Получить список использованных модулей CMS
      description: |
        Возвращает отсортированные уникальные имена модулей только из примеров
        со статусом `approved`.
      operationId: showcaseListUsedModules
      responses:
        '200':
          description: Список модулей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulesResponse'

  /modules/{moduleName}/examples:
    get:
      tags:
        - Examples
      summary: Получить примеры по имени модуля CMS
      description: |
        Поиск выполняется по точному имени модуля среди утверждённых примеров.
        Для неизвестного модуля возвращается успешный ответ с пустым `items`.
      operationId: showcaseListExamplesByModule
      parameters:
        - $ref: '#/components/parameters/ModuleName'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница примеров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplesPaginatedResponse'

  /examples:
    get:
      tags:
        - Examples
      summary: Получить публичный список примеров
      description: Возвращает только примеры со статусом `approved`, от новых к старым.
      operationId: showcaseListExamples
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: category_id
          in: query
          required: false
          description: ID категории. Несуществующий или нечисловой ID приводит к пустому списку.
          schema:
            type: integer
            minimum: 1
        - name: module
          in: query
          required: false
          description: Точное имя использованного модуля CMS.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Страница примеров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplesPaginatedResponse'

    post:
      tags:
        - My examples
      summary: Добавить пример сайта
      description: |
        Создаёт пример от имени текущего клиента со статусом `pending`.
        Для загрузки изображений используется `multipart/form-data`; без файлов
        допустим `application/json`.
      operationId: showcaseCreateExample
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreExampleMultipartRequest'
            examples:
              createWithImages:
                summary: Создание примера с двумя скриншотами
                value:
                  website_url: https://shop.example.ru
                  name: Интернет-магазин Example
                  short_description: Интернет-магазин электроники на базе Aizberg.
                  category_id: 1
                  modules:
                    - Catalog
                    - Shop
                    - Order
                  images:
                    - screenshot-main.png
                    - screenshot-catalog.png
          application/json:
            schema:
              $ref: '#/components/schemas/StoreExampleJsonRequest'
            examples:
              createWithoutImages:
                summary: Создание примера без изображений
                value:
                  website_url: https://blog.example.ru
                  name: Корпоративный блог Example
                  short_description: Блог компании с новостями и статьями.
                  category_id: 2
                  modules:
                    - Blogs
                    - Seo
      responses:
        '200':
          description: Пример создан и отправлен на модерацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /examples/{id}:
    parameters:
      - $ref: '#/components/parameters/ExampleId'

    get:
      tags:
        - Examples
      summary: Получить опубликованный пример
      description: |
        Возвращает только пример со статусом `approved`. Для отсутствующего,
        ожидающего или отклонённого примера возвращается одинаковая ошибка 400.
      operationId: showcaseGetExample
      responses:
        '200':
          description: Полные данные примера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

    patch:
      tags:
        - My examples
      summary: Обновить собственный пример
      description: |
        Доступно автору примера только в статусах `pending` и `rejected`. Все поля
        необязательны. После любого успешного запроса (в том числе пустого) статус
        становится `pending`, а `approved_at` и `approver` очищаются.
        Сначала удаляются изображения из `remove_image_ids`, затем добавляются новые `images`.

        Для загрузки файлов отправляйте `POST` с полем `_method=PATCH`: PHP не разбирает
        `multipart/form-data` в PATCH-запросах.
      operationId: showcaseUpdateOwnExample
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateExampleMultipartRequest'
            examples:
              updateWithImages:
                summary: Обновление данных, добавление и удаление изображений
                value:
                  website_url: https://shop.example.ru
                  name: Обновлённый интернет-магазин Example
                  short_description: Новое описание проекта после редизайна.
                  category_id: 1
                  modules:
                    - Catalog
                    - Shop
                    - Order
                    - Seo
                  images:
                    - screenshot-new-main.png
                    - screenshot-new-catalog.png
                  remove_image_ids:
                    - 15
                    - 16
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExampleJsonRequest'
            examples:
              updateFields:
                summary: Обновление полей без загрузки файлов
                value:
                  website_url: https://shop.example.ru
                  name: Обновлённый интернет-магазин Example
                  short_description: Новое описание проекта после редизайна.
                  category_id: 1
                  modules:
                    - Catalog
                    - Shop
                    - Seo
              removeImages:
                summary: Удаление существующих изображений
                value:
                  remove_image_ids:
                    - 15
                    - 16
      responses:
        '200':
          description: Пример обновлён и отправлен на повторную модерацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /my/examples:
    get:
      tags:
        - My examples
      summary: Получить примеры текущего клиента
      description: Возвращает собственные примеры клиента во всех статусах модерации, от новых к старым.
      operationId: showcaseListMyExamples
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница примеров текущего клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplesPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /moderation/pending:
    get:
      tags:
        - Moderation
      summary: Получить очередь модерации
      description: |
        Возвращает примеры со статусом `pending`, от новых к старым.
        Доступно только модератору.
      operationId: showcaseListPendingExamples
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница примеров, ожидающих модерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExamplesFullPaginatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /moderation/examples/{id}:
    parameters:
      - $ref: '#/components/parameters/ExampleId'

    get:
      tags:
        - Moderation
      summary: Получить пример для модерации
      description: Возвращает неудалённый пример в любом статусе. Доступно только модератору.
      operationId: showcaseGetExampleForModeration
      security:
        - clientSession: []
      responses:
        '200':
          description: Полные данные примера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags:
        - Moderation
      summary: Обновить пример как модератор
      description: |
        Доступно только модератору. Обновление не изменяет текущий статус
        модерации и не очищает сведения об утверждении. Для загрузки файлов
        отправляйте `POST` с полем `_method=PATCH`.
      operationId: showcaseUpdateExampleAsModerator
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateExampleMultipartRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExampleJsonRequest'
      responses:
        '200':
          description: Пример обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /moderation/examples/{id}/approve:
    post:
      tags:
        - Moderation
      summary: Утвердить пример
      description: |
        Устанавливает статус `approved`, текущее время утверждения и текущего
        клиента-модератора. После этого пример доступен публично. Операция
        применима к примеру в любом статусе.
      operationId: showcaseApproveExample
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/ExampleId'
      responses:
        '200':
          description: Пример утверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /moderation/examples/{id}/reject:
    post:
      tags:
        - Moderation
      summary: Отклонить пример
      description: |
        Устанавливает статус `rejected`, очищает `approved_at` и сохраняет
        текущего клиента как модератора, выполнившего отклонение (поле `approver`).
        Операция применима к примеру в любом статусе.
      operationId: showcaseRejectExample
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/ExampleId'
      responses:
        '200':
          description: Пример отклонён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExampleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    clientSession:
      type: apiKey
      in: cookie
      name: laravel_session
      description: |
        Активная сессия клиента Laravel для guard `client`. Имя cookie может
        отличаться, если в приложении переопределена настройка `session.cookie`.

  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      description: ID категории.
      schema:
        type: integer
        minimum: 1

    ExampleId:
      name: id
      in: path
      required: true
      description: ID примера сайта.
      schema:
        type: integer
        minimum: 1

    ModuleName:
      name: moduleName
      in: path
      required: true
      description: Точное URL-encoded имя модуля CMS.
      schema:
        type: string
        minLength: 1
        maxLength: 100

    Page:
      name: page
      in: query
      required: false
      description: |
        Номер страницы. Реализация приводит значение к integer и заменяет
        значения меньше 1 на 1.
      schema:
        type: integer
        minimum: 1
        default: 1

  responses:
    BadRequest:
      description: Ошибка бизнес-логики, сущность не найдена или недостаточно прикладных прав.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          examples:
            notFound:
              value:
                message: Пример не найден.
            forbidden:
              value:
                message: Нет прав модератора.

    Unauthorized:
      description: Клиентская сессия отсутствует или недействительна.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Unauthenticated.

    ValidationError:
      description: Ошибка валидации входных данных Laravel.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

    SuccessResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          enum:
            - success
          example: success

    ValidationErrorResponse:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    Category:
      type: object
      required:
        - id
        - name
        - slug
        - sort_order
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
        sort_order:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CategorySummary:
      type: object
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255

    CategoriesResponse:
      type: object
      required:
        - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    CategoryResponse:
      type: object
      required:
        - category
      properties:
        category:
          $ref: '#/components/schemas/Category'

    CategoryCreatedResponse:
      type: object
      required:
        - id
        - category
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        category:
          $ref: '#/components/schemas/Category'

    StoreCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          nullable: true
          maxLength: 255
          description: Должен быть уникальным. При отсутствии или `null` генерируется автоматически.
        sort_order:
          type: integer
          nullable: true
          minimum: 0
          default: 0

    UpdateCategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          type: string
          nullable: true
          maxLength: 255
          description: Уникальный slug. Пустая строка или `null` запускает повторную генерацию из имени.
        sort_order:
          type: integer
          nullable: true
          minimum: 0
          description: В текущей реализации `null` сохраняется как 0.

    ClientSummary:
      type: object
      nullable: true
      required:
        - id
        - first_name
        - last_name
      properties:
        id:
          type: integer
          minimum: 1
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true

    ExampleImage:
      type: object
      required:
        - id
        - url
        - sort_order
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        url:
          type: string
          format: uri
          nullable: true
        sort_order:
          type: integer
          minimum: 0

    ExampleListItem:
      type: object
      required:
        - id
        - website_url
        - name
        - short_description
        - category_id
        - category
        - modules
        - images
        - preview_image_url
        - author
        - moderation_status
        - approved_at
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        website_url:
          type: string
          format: uri
          maxLength: 512
        name:
          type: string
          maxLength: 255
        short_description:
          type: string
        category_id:
          type: integer
          format: int64
          minimum: 1
        category:
          allOf:
            - $ref: '#/components/schemas/CategorySummary'
          nullable: true
        modules:
          type: array
          items:
            type: string
            maxLength: 100
        images:
          type: array
          items:
            $ref: '#/components/schemas/ExampleImage'
        preview_image_url:
          type: string
          format: uri
          nullable: true
        author:
          $ref: '#/components/schemas/ClientSummary'
        moderation_status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        approved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExampleFull:
      allOf:
        - $ref: '#/components/schemas/ExampleListItem'
        - type: object
          required:
            - approver
          properties:
            approver:
              allOf:
                - $ref: '#/components/schemas/ClientSummary'
              description: |
                Модератор, утвердивший или отклонивший пример; `null`, если решение
                ещё не принято или пример снова отправлен на модерацию.

    PaginationMeta:
      type: object
      required:
        - current_page
        - last_page
        - per_page
        - total
      properties:
        current_page:
          type: integer
          minimum: 1
        last_page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          default: 20
          description: Настраивается через `SHOWCASE_EXAMPLES_PER_PAGE`.
        total:
          type: integer
          minimum: 0

    ExamplesPaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExampleListItem'

    ExamplesFullPaginatedResponse:
      allOf:
        - $ref: '#/components/schemas/PaginationMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ExampleFull'

    ModulesResponse:
      type: object
      required:
        - modules
      properties:
        modules:
          type: array
          items:
            type: string
            maxLength: 100

    ExampleResponse:
      type: object
      required:
        - example
      properties:
        example:
          $ref: '#/components/schemas/ExampleFull'

    ExampleCreatedResponse:
      type: object
      required:
        - id
        - example
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        example:
          $ref: '#/components/schemas/ExampleFull'

    StoreExampleBaseRequest:
      type: object
      required:
        - website_url
        - name
        - short_description
        - category_id
        - modules
      properties:
        website_url:
          type: string
          format: uri
          maxLength: 512
        name:
          type: string
          minLength: 1
          maxLength: 255
        short_description:
          type: string
          minLength: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
          description: Категория должна существовать.
        modules:
          type: array
          minItems: 1
          description: Имена обрезаются по краям, повторяющиеся значения удаляются.
          items:
            type: string
            maxLength: 100

    StoreExampleJsonRequest:
      allOf:
        - $ref: '#/components/schemas/StoreExampleBaseRequest'

    StoreExampleMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/StoreExampleBaseRequest'
        - type: object
          properties:
            images:
              type: array
              nullable: true
              description: |
                Изображения до 4096 КБ каждое. По умолчанию у примера сохраняется
                не более 10 изображений (`SHOWCASE_MAX_IMAGES`); лишние файлы
                отбрасываются без ошибки.
              items:
                type: string
                format: binary

    UpdateExampleBaseRequest:
      type: object
      properties:
        website_url:
          type: string
          format: uri
          maxLength: 512
        name:
          type: string
          minLength: 1
          maxLength: 255
        short_description:
          type: string
          minLength: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
          description: Категория должна существовать.
        modules:
          type: array
          minItems: 1
          description: Полностью заменяет текущий список модулей.
          items:
            type: string
            maxLength: 100
        remove_image_ids:
          type: array
          nullable: true
          description: |
            Удаляются только изображения, принадлежащие редактируемому примеру;
            чужие и несуществующие ID игнорируются.
          items:
            type: integer
            format: int64
            minimum: 1

    UpdateExampleJsonRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateExampleBaseRequest'

    UpdateExampleMultipartRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateExampleBaseRequest'
        - type: object
          properties:
            _method:
              type: string
              enum:
                - PATCH
              description: Обязательно при отправке методом `POST` (подмена метода Laravel).
            images:
              type: array
              nullable: true
              description: |
                Новые изображения до 4096 КБ каждое, добавляются к существующим.
                Файлы сверх лимита `SHOWCASE_MAX_IMAGES` отбрасываются; если лимит
                уже исчерпан, текущая реализация возвращает HTTP 500.
              items:
                type: string
                format: binary
