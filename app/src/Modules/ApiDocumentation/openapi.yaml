openapi: 3.0.3
info:
  title: ApiDocumentation API
  version: 1.0.0
  description: |
    REST API модуля **ApiDocumentation** для публикации многоязычных справочников API
    и управления древовидными разделами (не более трёх уровней).

    Публичные операции возвращают только документы с `is_published=true` и локализуют
    переводимые поля. Управляющие операции возвращают все переводы и доступны владельцу
    через middleware `web` + `auth:client`.

    Успешные ответы имеют HTTP 200 и не используют общую обёртку. Ошибки бизнес-логики
    обычно имеют HTTP 400, ошибки валидации — HTTP 422, отсутствие публичного документа — 404.
servers:
  - url: /api/api-documentations
    description: Префикс модуля
tags:
  - name: Public
    description: Публичное чтение опубликованной документации
  - name: Management
    description: Управление документациями текущего клиента
  - name: Sections
    description: Управление разделами документации текущего клиента

paths:
  /:
    get:
      tags: [Public]
      operationId: listPublicApiDocumentations
      summary: Список опубликованных документаций
      parameters:
        - $ref: '#/components/parameters/OptionalSearch'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница опубликованных документаций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocumentationPage'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Management]
      operationId: createApiDocumentation
      summary: Создать документацию
      description: Требуется клиентская сессия. Владелец определяется по текущему клиенту.
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentationRequest'
            example:
              slug: seller-api
              name: {ru: API продавца, en: Seller API}
              short_description: {ru: Интеграция магазина с площадкой, en: Marketplace integration}
              tags: [seller, orders]
              default_locale: ru
              is_published: true
      responses:
        '200':
          description: Документация создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentationCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /search:
    get:
      tags: [Public]
      operationId: searchPublicApiDocumentations
      summary: Найти опубликованные документации
      description: Поиск по slug, названиям, кратким описаниям и тегам. Результат пагинируется.
      parameters:
        - $ref: '#/components/parameters/RequiredSearch'
        - $ref: '#/components/parameters/Locale'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocumentationPage'
        '422':
          $ref: '#/components/responses/ValidationError'

  /manage:
    get:
      tags: [Management]
      operationId: listOwnedApiDocumentations
      summary: Список документаций текущего клиента
      description: Включает опубликованные и черновые документы; переводимые поля возвращаются словарями.
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/OptionalSearch'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Страница документаций владельца
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDocumentationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /manage/{id}:
    get:
      tags: [Management]
      operationId: getOwnedApiDocumentation
      summary: Получить документацию для редактирования
      description: Возвращает дерево разделов и все словари переводов.
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/DocumentationId'
      responses:
        '200':
          description: Полная документация владельца
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagementDocumentation'
        '400':
          $ref: '#/components/responses/OwnerResourceNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{id}:
    parameters:
      - $ref: '#/components/parameters/DocumentationId'
    patch:
      tags: [Management]
      operationId: updateApiDocumentation
      summary: Частично обновить документацию
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentationRequest'
      responses:
        '200':
          description: Документация обновлена
          content:
            application/json:
              schema:
                type: object
                required: [documentation]
                properties:
                  documentation:
                    $ref: '#/components/schemas/ManagementDocumentation'
        '400':
          $ref: '#/components/responses/OwnerResourceNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Management]
      operationId: deleteApiDocumentation
      summary: Удалить документацию
      description: Мягко удаляет документ; его разделы перестают быть доступны через модуль.
      security:
        - clientSession: []
      responses:
        '200':
          description: Документация удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/OwnerResourceNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{documentationId}/sections:
    post:
      tags: [Sections]
      operationId: createDocumentationSection
      summary: Создать раздел
      description: Родитель должен принадлежать этому документу; глубина дерева ограничена тремя уровнями.
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/DocumentationIdNamed'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSectionRequest'
            example:
              parent_id: null
              position: 10
              slug: create-order
              title: {ru: Создать заказ, en: Create an order}
              description_blocks:
                - type: text
                  content: {ru: Метод создаёт заказ., en: Creates an order.}
              endpoint: {method: POST, url: /v1/orders}
              request_body:
                content_type: application/json
                schema: {type: object, required: [external_id]}
              request_headers: []
              request_parameters: []
              request_example: {external_id: order-1000}
              responses:
                - status_code: '200'
                  name: {ru: Успех, en: Success}
                  description: {ru: Заказ создан, en: Order created}
                  type: object
                  content_type: application/json
                  example: {id: 42}
      responses:
        '200':
          description: Раздел создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionMutationResponse'
        '400':
          $ref: '#/components/responses/OwnerResourceNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationOrHierarchyError'

  /{documentationId}/sections/{sectionId}:
    parameters:
      - $ref: '#/components/parameters/DocumentationIdNamed'
      - $ref: '#/components/parameters/SectionId'
    patch:
      tags: [Sections]
      operationId: updateDocumentationSection
      summary: Частично обновить или переместить раздел
      description: При смене `parent_id` уровни потомков пересчитываются; циклы и глубина более 3 запрещены.
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionRequest'
      responses:
        '200':
          description: Раздел обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionMutationResponse'
        '400':
          $ref: '#/components/responses/OwnerResourceNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationOrHierarchyError'
    delete:
      tags: [Sections]
      operationId: deleteDocumentationSection
      summary: Удалить раздел с подразделами
      description: Физически удаляет раздел; дочерние разделы удаляются каскадно.
      security:
        - clientSession: []
      responses:
        '200':
          description: Раздел удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/OwnerResourceNotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /{slug}/search:
    get:
      tags: [Public]
      operationId: searchInsideApiDocumentation
      summary: Поиск по разделам опубликованной документации
      description: Ищет в заголовках, блоках (включая заголовок и текст карточек `card`), endpoint, схемах, параметрах и ответах; лимит задаётся конфигурацией.
      parameters:
        - $ref: '#/components/parameters/DocumentationSlug'
        - $ref: '#/components/parameters/RequiredSearch'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Ранжированные совпадения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectionSearchResponse'
        '404':
          $ref: '#/components/responses/PublicResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /{slug}:
    get:
      tags: [Public]
      operationId: getPublicApiDocumentation
      summary: Получить опубликованную документацию
      description: Возвращает локализованный документ и дерево разделов.
      parameters:
        - $ref: '#/components/parameters/DocumentationSlug'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Полная публичная документация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDocumentation'
        '404':
          $ref: '#/components/responses/PublicResourceNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    clientSession:
      type: apiKey
      in: cookie
      name: aizberg_session
      description: Cookie Laravel-сессии клиента. Все маршруты модуля исключены из проверки CSRF.
  parameters:
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 1, default: 1}
    Locale:
      name: locale
      in: query
      description: BCP-47-подобный код языка; при отсутствии перевода используется default_locale.
      schema:
        type: string
        maxLength: 16
        pattern: '^[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})*$'
        example: ru
    OptionalSearch:
      name: q
      in: query
      schema: {type: string, maxLength: 255}
    RequiredSearch:
      name: q
      in: query
      required: true
      schema: {type: string, minLength: 2, maxLength: 255}
    DocumentationId:
      name: id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    DocumentationIdNamed:
      name: documentationId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    SectionId:
      name: sectionId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    DocumentationSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-zA-Z0-9_-]+$'
        example: seller-api
  responses:
    Unauthorized:
      description: Клиент не авторизован
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MessageResponse'}
          example: {message: Unauthenticated.}
    OwnerResourceNotFound:
      description: Ресурс не найден либо не принадлежит текущему клиенту
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MessageResponse'}
          example: {message: Документация не найдена или нет прав.}
    PublicResourceNotFound:
      description: Опубликованная документация с таким slug не найдена
      content:
        application/json:
          schema: {$ref: '#/components/schemas/MessageResponse'}
          example: {message: Документация не найдена.}
    ValidationError:
      description: Ошибка валидации Laravel
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ValidationError'}
    ValidationOrHierarchyError:
      description: Ошибка валидации либо нарушение структуры дерева
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationError'
              - $ref: '#/components/schemas/MessageResponse'
          examples:
            maxDepth: {value: {message: Документация поддерживает не более трёх уровней разделов.}}
  schemas:
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
    SuccessMessage:
      type: object
      required: [message]
      properties:
        message: {type: string, example: success}
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: {type: string, example: The given data was invalid.}
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
    TranslationMap:
      type: object
      description: Словарь «код языка → строка»; ключ соответствует шаблону locale.
      minProperties: 1
      additionalProperties: {type: string}
      example: {ru: Текст, en: Text}
    JsonSchema:
      description: Произвольная JSON Schema в форме JSON-объекта или массива; модуль сохраняет её без интерпретации.
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
    JsonContainer:
      description: Произвольный JSON-объект или массив.
      nullable: true
      oneOf:
        - type: object
          additionalProperties: true
        - type: array
          items: {}
    Endpoint:
      type: object
      nullable: true
      required: [method, url]
      properties:
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE], nullable: true}
        url: {type: string, maxLength: 2048, nullable: true}
    RequestBodyDefinition:
      type: object
      nullable: true
      required: [content_type]
      properties:
        content_type: {type: string, maxLength: 255, example: application/json}
        schema: {$ref: '#/components/schemas/JsonSchema'}
    ParameterInput:
      type: object
      required: [name, required, description, type]
      properties:
        name: {type: string, maxLength: 255}
        location: {type: string, nullable: true, enum: [query, path, header, cookie, body]}
        required: {type: boolean}
        description: {$ref: '#/components/schemas/TranslationMap'}
        type: {type: string, maxLength: 100, example: string}
        example: {nullable: true}
    ParameterPublic:
      allOf:
        - $ref: '#/components/schemas/ParameterInput'
        - type: object
          properties:
            description: {type: string, nullable: true}
    ResponseInput:
      type: object
      required: [status_code, name, description, type]
      properties:
        status_code: {type: string, pattern: '^(default|[1-5][0-9]{2})$', example: '200'}
        name: {$ref: '#/components/schemas/TranslationMap'}
        description: {$ref: '#/components/schemas/TranslationMap'}
        type: {type: string, maxLength: 100, example: object}
        content_type: {type: string, nullable: true, maxLength: 255}
        schema: {$ref: '#/components/schemas/JsonSchema'}
        example: {$ref: '#/components/schemas/JsonContainer'}
    ResponsePublic:
      allOf:
        - $ref: '#/components/schemas/ResponseInput'
        - type: object
          properties:
            name: {type: string, nullable: true}
            description: {type: string, nullable: true}
    TextBlockInput:
      type: object
      required: [type, content]
      properties:
        type: {type: string, enum: [text, code, important]}
        content:
          allOf: [{$ref: '#/components/schemas/TranslationMap'}]
          description: |
            Для `text` и `important` — Markdown: абзацы через `\n\n`, списки `- `, `**жирный**`,
            `[текст](https://...)`, ссылка на раздел документации `[текст](section:14)`.
            Сохраняется и отдаётся без экранирования.
        language: {type: string, maxLength: 50, nullable: true}
    CardBlockInput:
      type: object
      required: [type, variant, title, content]
      properties:
        type: {type: string, enum: [card]}
        variant:
          type: string
          enum: [accent, default]
          description: '`accent` — голубая рамка, `default` — серая.'
        title: {$ref: '#/components/schemas/TranslationMap'}
        content:
          allOf: [{$ref: '#/components/schemas/TranslationMap'}]
          description: Markdown, как у блока `text`.
      example:
        type: card
        variant: accent
        title: {ru: 3 варианта знакомства с Aizberg, en: 3 ways to get started}
        content: {ru: "Существует 3 способа:\n\n- Первый\n- Второй\n- Третий", en: "There are 3 ways:\n\n- First\n- Second\n- Third"}
    SectionLinkBlockInput:
      type: object
      required: [type, section_id, label]
      properties:
        type: {type: string, enum: [section_link]}
        section_id: {type: integer, format: int64, minimum: 1}
        label: {$ref: '#/components/schemas/TranslationMap'}
    VariableBlockInput:
      type: object
      required: [type, name]
      properties:
        type: {type: string, enum: [variable]}
        name: {type: string, maxLength: 255}
        description:
          allOf: [{$ref: '#/components/schemas/TranslationMap'}]
          nullable: true
    TableColumnInput:
      type: object
      required: [key, title]
      properties:
        key: {type: string}
        title: {$ref: '#/components/schemas/TranslationMap'}
    TableRowInput:
      type: object
      required: [cells]
      properties:
        cells:
          type: object
          additionalProperties: {$ref: '#/components/schemas/TranslationMap'}
    TableBlockInput:
      type: object
      required: [type, columns]
      properties:
        type: {type: string, enum: [table]}
        columns: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TableColumnInput'}}
        rows: {type: array, items: {$ref: '#/components/schemas/TableRowInput'}}
    DescriptionBlockInput:
      oneOf:
        - $ref: '#/components/schemas/TextBlockInput'
        - $ref: '#/components/schemas/SectionLinkBlockInput'
        - $ref: '#/components/schemas/VariableBlockInput'
        - $ref: '#/components/schemas/TableBlockInput'
        - $ref: '#/components/schemas/CardBlockInput'
      discriminator: {propertyName: type}
    DescriptionBlockPublic:
      type: object
      description: Публичный блок; переводимые значения уже представлены строками.
      required: [type]
      properties:
        type: {type: string, enum: [text, code, important, section_link, variable, table, card]}
        content: {type: string, nullable: true, description: 'Для `text`, `important` и `card` — Markdown без экранирования.'}
        variant: {type: string, enum: [accent, default], nullable: true, description: Только для `card`.}
        title: {type: string, nullable: true, description: Заголовок карточки `card`.}
        language: {type: string, nullable: true}
        section_id: {type: integer, nullable: true}
        label: {type: string, nullable: true}
        name: {type: string, nullable: true}
        description: {type: string, nullable: true}
        columns: {type: array, items: {type: object, additionalProperties: true}}
        rows: {type: array, items: {type: object, additionalProperties: true}}
    CreateDocumentationRequest:
      type: object
      required: [slug, name, short_description]
      properties:
        slug: {type: string, maxLength: 255, pattern: '^[a-zA-Z0-9_-]+$', description: Уникален глобально; manage и search запрещены.}
        name: {$ref: '#/components/schemas/TranslationMap'}
        short_description: {$ref: '#/components/schemas/TranslationMap'}
        tags: {type: array, nullable: true, maxItems: 50, items: {type: string, maxLength: 100}, uniqueItems: true}
        default_locale: {type: string, maxLength: 16, default: Код локали приложения}
        is_published: {type: boolean, default: true}
    UpdateDocumentationRequest:
      type: object
      minProperties: 1
      properties:
        slug: {type: string, maxLength: 255, pattern: '^[a-zA-Z0-9_-]+$'}
        name: {$ref: '#/components/schemas/TranslationMap'}
        short_description: {$ref: '#/components/schemas/TranslationMap'}
        tags: {type: array, maxItems: 50, items: {type: string, maxLength: 100}, uniqueItems: true}
        default_locale: {type: string, maxLength: 16}
        is_published: {type: boolean}
    SectionWritableFields:
      type: object
      properties:
        parent_id: {type: integer, format: int64, minimum: 1, nullable: true}
        position: {type: integer, minimum: 0, default: 0}
        slug: {type: string, maxLength: 255, pattern: '^[a-zA-Z0-9_-]+$'}
        title: {$ref: '#/components/schemas/TranslationMap'}
        description_blocks: {type: array, items: {$ref: '#/components/schemas/DescriptionBlockInput'}}
        endpoint: {$ref: '#/components/schemas/Endpoint'}
        request_body: {$ref: '#/components/schemas/RequestBodyDefinition'}
        request_headers: {type: array, items: {$ref: '#/components/schemas/ParameterInput'}}
        request_parameters: {type: array, items: {$ref: '#/components/schemas/ParameterInput'}}
        request_example: {$ref: '#/components/schemas/JsonContainer'}
        responses: {type: array, items: {$ref: '#/components/schemas/ResponseInput'}}
    CreateSectionRequest:
      allOf:
        - $ref: '#/components/schemas/SectionWritableFields'
        - type: object
          required: [slug, title]
    UpdateSectionRequest:
      allOf:
        - $ref: '#/components/schemas/SectionWritableFields'
    PublicDocumentationSummary:
      type: object
      required: [id, slug, name, short_description, tags, locale, default_locale, is_published, updated_at]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        name: {type: string, nullable: true}
        short_description: {type: string, nullable: true}
        tags: {type: array, items: {type: string}}
        locale: {type: string}
        default_locale: {type: string}
        is_published: {type: boolean}
        updated_at: {type: string, format: date-time, nullable: true}
    ManagementDocumentationSummary:
      allOf:
        - $ref: '#/components/schemas/PublicDocumentationSummary'
        - type: object
          properties:
            name: {$ref: '#/components/schemas/TranslationMap'}
            short_description: {$ref: '#/components/schemas/TranslationMap'}
            locale: {nullable: true, example: null}
    PageMetadata:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: {type: integer, minimum: 1}
        last_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, example: 20}
        total: {type: integer, minimum: 0}
    PublicDocumentationPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [items]
          properties:
