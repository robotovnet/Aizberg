        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true

    ShowcaseExampleFull:
      allOf:
        - $ref: '#/components/schemas/ShowcaseExampleListItem'
        - type: object
          required: [approver]
          properties:
            approver:
              allOf:
