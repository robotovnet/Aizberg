  /api/api-documentations:
    get:
      tags: [API docs public]
      operationId: listPublicApiDocumentations
      summary: Список опубликованных документаций
      description: Возвращает локализованные карточки; при отсутствии перевода используется default_locale.
      parameters: [{$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Страница документаций, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocPublicPage'}}}}, '422': {$ref: '#/components/responses/ValidationError'}}
    post:
      tags: [API docs management]
      operationId: createApiDocumentation
      summary: Создать API-документацию
      security: [{clientSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocCreateRequest'}}}}
      responses: {'200': {description: Документация создана, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocCreatedResponse'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/api-documentations/search:
    get:
      tags: [API docs public]
      operationId: searchApiDocumentations
      summary: Найти опубликованные документации
      description: Поиск по slug, названиям, кратким описаниям и тегам.
      parameters: [{$ref: '#/components/parameters/RequiredSearch'}, {$ref: '#/components/parameters/Locale'}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Результаты поиска, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocPublicPage'}}}}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/api-documentations/manage:
    get:
      tags: [API docs management]
      operationId: listOwnedApiDocumentations
      summary: Документации текущего клиента
      description: Включает опубликованные документы и черновики, переводимые поля возвращаются картами локалей.
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/Search'}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Страница документов владельца, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocManagePage'}}}}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/api-documentations/manage/{id}:
    get:
      tags: [API docs management]
      operationId: getOwnedApiDocumentation
      summary: Получить документ для редактирования
      description: Возвращает все переводы и полное дерево разделов.
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/DocumentationId'}]
      responses: {'200': {description: Документ владельца, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocManage'}}}}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/api-documentations/{id}:
    parameters: [{$ref: '#/components/parameters/DocumentationId'}]
    patch:
      tags: [API docs management]
      operationId: updateApiDocumentation
      summary: Частично изменить документацию
      security: [{clientSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocUpdateRequest'}}}}
      responses: {'200': {description: Документ обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocUpdatedResponse'}}}}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
    delete:
      tags: [API docs management]
      operationId: deleteApiDocumentation
      summary: Удалить документацию
      description: Мягкое удаление документа; его разделы перестают быть публично доступны.
      security: [{clientSession: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/api-documentations/{documentationId}/sections:
    post:
      tags: [API docs sections]
      operationId: createApiDocumentationSection
      summary: Создать раздел
      description: Родитель должен принадлежать документу. Максимальная глубина дерева — 3 уровня.
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/DocumentationIdNamed'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocSectionCreateRequest'}}}}
      responses: {'200': {description: Раздел создан, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocSectionMutationResponse'}}}}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ApiDocSectionValidationError'}}
  /api/api-documentations/{documentationId}/sections/{sectionId}:
    parameters: [{$ref: '#/components/parameters/DocumentationIdNamed'}, {$ref: '#/components/parameters/SectionId'}]
    patch:
      tags: [API docs sections]
      operationId: updateApiDocumentationSection
      summary: Частично изменить или переместить раздел
      description: При смене parent_id пересчитывается глубина потомков; циклы и глубина больше 3 запрещены.
      security: [{clientSession: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocSectionUpdateRequest'}}}}
      responses: {'200': {description: Раздел обновлён, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocSectionMutationResponse'}}}}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ApiDocSectionValidationError'}}
    delete:
      tags: [API docs sections]
      operationId: deleteApiDocumentationSection
      summary: Удалить раздел и подразделы
      description: Физически удаляет раздел; дочерние разделы удаляются каскадно.
      security: [{clientSession: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /api/api-documentations/{slug}/search:
    get:
      tags: [API docs public]
      operationId: searchInsideApiDocumentation
      summary: Поиск внутри документации
      description: Ищет в заголовках, блоках (включая заголовок и текст карточек `card`), endpoint, схемах, параметрах и ответах опубликованного документа.
      parameters: [{$ref: '#/components/parameters/DocumentationSlug'}, {$ref: '#/components/parameters/RequiredSearch'}, {$ref: '#/components/parameters/Locale'}]
      responses: {'200': {description: Ранжированные совпадения разделов, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocSectionSearchResponse'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/api-documentations/{slug}:
    get:
      tags: [API docs public]
      operationId: getPublicApiDocumentation
      summary: Получить опубликованную документацию
      description: Возвращает локализованный документ и дерево разделов.
      parameters: [{$ref: '#/components/parameters/DocumentationSlug'}, {$ref: '#/components/parameters/Locale'}]
      responses: {'200': {description: Полная документация, content: {application/json: {schema: {$ref: '#/components/schemas/ApiDocPublic'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '422': {$ref: '#/components/responses/ValidationError'}}

  /api/blogs/sections:
    get:
      tags: [Blogs sections]
      summary: Список разделов (дерево)
      description: Возвращает корневые разделы с вложенными подразделами (максимум 2 уровня).
      operationId: listBlogSections
      responses:
        '200':
          description: Дерево разделов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogSectionsListResponse'
              example:
                sections:
                  - id: 1
                    name: Новости
                    slug: news
                    parent_id: null
                    sort_order: 0
                    created_at: '2026-06-15T10:00:00+00:00'
                    updated_at: '2026-06-15T10:00:00+00:00'
                    children:
                      - id: 2
                        name: Обзоры
                        slug: reviews
                        parent_id: 1
                        sort_order: 0
                        created_at: '2026-06-15T10:05:00+00:00'
                        updated_at: '2026-06-15T10:05:00+00:00'

    post:
      tags: [Blogs sections]
      summary: Создать раздел
      description: |
        Требует запись в таблице `blog_section_permissions`.
        Подраздел (`parent_id`) можно создать только внутри корневого раздела.
      operationId: createBlogSection
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogStoreSectionRequest'
      responses:
        '200':
          description: Раздел создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogSectionCreatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/blogs/sections/{id}:
    parameters:
      - $ref: '#/components/parameters/BlogSectionId'

    get:
      tags: [Blogs sections]
      summary: Получить раздел
      operationId: getBlogSection
      responses:
        '200':
          description: Данные раздела
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogSectionResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

    patch:
      tags: [Blogs sections]
      summary: Обновить раздел
      description: |
        Требует запись в таблице `blog_section_permissions`. Все поля необязательны;
        пустой запрос допустим и возвращает раздел без изменений.
      operationId: updateBlogSection
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogUpdateSectionRequest'
      responses:
        '200':
          description: Раздел обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogSectionResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Blogs sections]
      summary: Удалить раздел
      description: |
        Требует запись в таблице `blog_section_permissions`.
        Нельзя удалить раздел с подразделами или статьями.
      operationId: deleteBlogSection
      security:
        - clientSession: []
      responses:
        '200':
          description: Раздел удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/blogs/sections/{id}/articles:
    parameters:
      - $ref: '#/components/parameters/BlogSectionId'
      - $ref: '#/components/parameters/Page'

    get:
      tags: [Blogs articles]
      summary: Статьи раздела
      description: |
        Возвращает статьи указанного раздела. Для корневого раздела включаются
        также статьи всех его подразделов. Архивированные статьи не показываются.
        Контроллер не проверяет существование раздела: для неизвестного `id`
        возвращается успешный ответ с пустым `items`.
      operationId: listBlogArticlesByBlogSection
      responses:
        '200':
          description: Список статей с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticlesPaginatedResponse'

  /api/blogs/articles:
    get:
      tags: [Blogs articles]
      summary: Список статей
      description: Архивированные статьи не включаются в выборку.
      operationId: listBlogArticles
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: section_id
          in: query
          description: Фильтр по разделу (для корневого — включает подразделы)
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Список статей с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticlesPaginatedResponse'

    post:
      tags: [Blogs articles]
      summary: Создать статью
      description: |
        Автор (`client_id`), `created_at` и `updated_at` заполняются автоматически.
        Любой авторизованный клиент может создать статью.
      operationId: createBlogArticle
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogStoreArticleRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BlogStoreArticleRequestJson'
      responses:
        '200':
          description: Статья создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticleCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/blogs/articles/{id}:
    parameters:
      - $ref: '#/components/parameters/BlogArticleId'

    get:
      tags: [Blogs articles]
      summary: Получить статью
      description: Архивированные статьи недоступны через публичный просмотр.
      operationId: getBlogArticle
      responses:
        '200':
          description: Полные данные статьи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

    patch:
      tags: [Blogs articles]
      summary: Обновить статью
      description: |
        Доступно автору статьи или модератору (`blog_moderator_permissions`).
        Все поля необязательны; пустой запрос допустим и возвращает статью без изменений.
      operationId: updateBlogArticle
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BlogUpdateArticleRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/BlogUpdateArticleRequestJson'
      responses:
        '200':
          description: Статья обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Blogs articles]
      summary: Удалить статью
      description: |
        Мягкое удаление (soft delete). Доступно автору или модератору.
      operationId: deleteBlogArticle
      security:
        - clientSession: []
      responses:
        '200':
          description: Статья удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/blogs/articles/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/BlogArticleId'

    post:
      tags: [Blogs articles]
      summary: Архивировать статью
      description: |
        Устанавливает `is_archived = true`. Доступно автору или модератору.
        Архивированные статьи скрыты из публичных списков и просмотра.
      operationId: archiveBlogArticle
      security:
        - clientSession: []
      responses:
        '200':
          description: Статья архивирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogArticleArchivedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/blogs/articles/{id}/comments:
    parameters:
      - $ref: '#/components/parameters/BlogArticleId'

    get:
      tags: [Blogs comments]
      summary: Комментарии к статье
      description: |
        Возвращает корневые комментарии и один уровень прямых ответов в поле `replies`.
        Архивированная статья считается не найденной.
      operationId: listBlogComments
      responses:
        '200':
          description: Дерево комментариев
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogCommentsListResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

    post:
      tags: [Blogs comments]
      summary: Добавить комментарий к статье
      description: |
        Создаёт корневой комментарий (без `parent_id`).
        Автор и время создания заполняются автоматически.
      operationId: createBlogComment
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogStoreCommentRequest'
      responses:
        '200':
          description: Комментарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogCommentCreatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/blogs/comments/{commentId}/replies:
    parameters:
      - $ref: '#/components/parameters/BlogCommentId'

    post:
      tags: [Blogs comments]
      summary: Ответить на комментарий
      description: |
        Создаёт ответ с `parent_id`, равным ID указанного комментария. Код разрешает
        ответить в том числе на ответ, однако публичный список сериализует только
        один уровень `replies`.
      operationId: replyToBlogComment
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogStoreCommentRequest'
      responses:
        '200':
          description: Ответ создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogCommentReplyCreatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/blogs/comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/BlogCommentId'

    patch:
      tags: [Blogs comments]
      summary: Редактировать комментарий
      description: Доступно автору комментария или модератору.
      operationId: updateBlogComment
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogUpdateCommentRequest'
      responses:
        '200':
          description: Комментарий обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogCommentUpdatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Blogs comments]
      summary: Удалить комментарий
      description: |
        Мягкое удаление. Доступно автору комментария или модератору.
      operationId: deleteBlogComment
      security:
        - clientSession: []
      responses:
        '200':
          description: Комментарий удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/showcase/categories:
    get:
      tags: [Showcase categories]
      summary: Список категорий
      description: Категории отсортированы по `sort_order`, затем по `name`.
      operationId: listShowcaseCategories
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseCategoriesListResponse'
              example:
                categories:
                  - id: 1
                    name: Интернет-магазин
                    slug: online-store
                    sort_order: 0
                    created_at: '2026-06-15T13:00:00+00:00'
                    updated_at: '2026-06-15T13:00:00+00:00'
                  - id: 2
                    name: Блог
                    slug: blog
                    sort_order: 1
                    created_at: '2026-06-15T13:00:00+00:00'
                    updated_at: '2026-06-15T13:00:00+00:00'

    post:
      tags: [Showcase categories]
      summary: Создать категорию
      description: |
        Требует запись в таблице `showcase_moderator_permissions`.
        Если `slug` не передан, пуст или равен `null`, уникальный slug генерируется из `name`.
      operationId: createShowcaseCategory
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseStoreCategoryRequest'
      responses:
        '200':
          description: Категория создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseCategoryCreatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/showcase/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ShowcaseCategoryId'

    get:
      tags: [Showcase categories]
      summary: Получить категорию
      operationId: getShowcaseCategory
      responses:
        '200':
          description: Данные категории
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseCategoryResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

    patch:
      tags: [Showcase categories]
      summary: Обновить категорию
      description: |
        Требует запись в таблице `showcase_moderator_permissions`. Все поля необязательны;
        пустой запрос допустим и возвращает категорию без изменений.
      operationId: updateShowcaseCategory
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseUpdateCategoryRequest'
      responses:
        '200':
          description: Категория обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseCategoryResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags: [Showcase categories]
      summary: Удалить категорию
      description: |
        Требует запись в таблице `showcase_moderator_permissions`.
        Нельзя удалить категорию, в которой есть хотя бы один пример сайта.
      operationId: deleteShowcaseCategory
      security:
        - clientSession: []
      responses:
        '200':
          description: Категория удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/showcase/categories/{id}/examples:
    parameters:
      - $ref: '#/components/parameters/ShowcaseCategoryId'
      - $ref: '#/components/parameters/Page'

    get:
      tags: [Showcase examples]
      summary: Примеры категории
      description: |
        Возвращает утверждённые (`approved`) примеры указанной категории, от новых к старым.
        Для несуществующей категории возвращается HTTP 400.
      operationId: listShowcaseExamplesByCategory
      responses:
        '200':
          description: Список примеров с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExamplesPaginatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

  /api/showcase/modules:
    get:
      tags: [Showcase examples]
      summary: Использованные модули CMS
      description: Уникальные имена модулей из утверждённых примеров, отсортированные по алфавиту.
      operationId: listShowcaseUsedModules
      responses:
        '200':
          description: Список имён модулей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseModulesListResponse'
              example:
                modules: [Blogs, Catalog, Order, Shop]

  /api/showcase/modules/{moduleName}/examples:
    parameters:
      - $ref: '#/components/parameters/ShowcaseModuleName'
      - $ref: '#/components/parameters/Page'

    get:
      tags: [Showcase examples]
      summary: Примеры по модулю CMS
      description: |
        Утверждённые примеры, в которых использован модуль с точно совпадающим именем.
        Для неизвестного модуля возвращается успешный ответ с пустым `items`.
      operationId: listShowcaseExamplesByModule
      responses:
        '200':
          description: Список примеров с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExamplesPaginatedResponse'

  /api/showcase/examples:
    get:
      tags: [Showcase examples]
      summary: Список примеров
      description: Возвращает только утверждённые (`approved`) примеры, от новых к старым.
      operationId: listShowcaseExamples
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: category_id
          in: query
          required: false
          description: Фильтр по ID категории. Неизвестный или нечисловой ID даёт пустой `items`.
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: module
          in: query
          required: false
          description: Фильтр по точному имени использованного модуля CMS.
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Список примеров с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExamplesPaginatedResponse'

    post:
      tags: [Showcase my examples]
      summary: Добавить пример сайта
      description: |
        Создаёт пример от имени текущего клиента со статусом `pending`.
        Для загрузки скриншотов используйте `multipart/form-data` (поля `modules[]`, `images[]`);
        без файлов допустим `application/json`.
      operationId: createShowcaseExample
      security:
        - clientSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShowcaseStoreExampleRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseStoreExampleRequestJson'
            example:
              website_url: https://shop.example.ru
              name: Интернет-магазин Example
              short_description: Интернет-магазин электроники на базе Aizberg.
              category_id: 1
              modules: [Catalog, Shop, Order]
      responses:
        '200':
          description: Пример создан и отправлен на модерацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/showcase/examples/{id}:
    parameters:
      - $ref: '#/components/parameters/ShowcaseExampleId'

    get:
      tags: [Showcase examples]
      summary: Получить пример
      description: |
        Возвращает только утверждённый пример. Для отсутствующего, ожидающего
        или отклонённого примера возвращается одинаковая ошибка HTTP 400.
      operationId: getShowcaseExample
      responses:
        '200':
          description: Полные данные примера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'

    patch:
      tags: [Showcase my examples]
      summary: Обновить свой пример
      description: |
        Доступно автору примера только в статусах `pending` и `rejected`. Все поля необязательны.
        После любого успешного запроса (в том числе пустого) статус становится `pending`,
        а `approved_at` и `approver` очищаются.
        Сначала удаляются изображения из `remove_image_ids`, затем добавляются новые `images`.

        PHP не разбирает `multipart/form-data` в PATCH-запросах, поэтому для загрузки файлов
        отправляйте `POST` с полем `_method=PATCH`.
      operationId: updateOwnShowcaseExample
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShowcaseUpdateExampleRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseUpdateExampleRequestJson'
            example:
              name: Обновлённый интернет-магазин Example
              modules: [Catalog, Shop, Seo]
              remove_image_ids: [15, 16]
      responses:
        '200':
          description: Пример обновлён и отправлен на повторную модерацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/showcase/my/examples:
    get:
      tags: [Showcase my examples]
      summary: Мои примеры
      description: Примеры текущего клиента во всех статусах модерации, от новых к старым.
      operationId: listMyShowcaseExamples
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Список примеров с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExamplesPaginatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/showcase/moderation/pending:
    get:
      tags: [Showcase moderation]
      summary: Очередь модерации
      description: |
        Примеры со статусом `pending`, от новых к старым.
        Требует запись в таблице `showcase_moderator_permissions`.
      operationId: listPendingShowcaseExamples
      security:
        - clientSession: []
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Список примеров с пагинацией (элементы содержат `approver`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExamplesFullPaginatedResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/showcase/moderation/examples/{id}:
    parameters:
      - $ref: '#/components/parameters/ShowcaseExampleId'

    get:
      tags: [Showcase moderation]
      summary: Получить пример для модерации
      description: |
        Возвращает неудалённый пример в любом статусе.
        Требует запись в таблице `showcase_moderator_permissions`.
      operationId: getShowcaseExampleForModeration
      security:
        - clientSession: []
      responses:
        '200':
          description: Полные данные примера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

    patch:
      tags: [Showcase moderation]
      summary: Обновить пример как модератор
      description: |
        Требует запись в таблице `showcase_moderator_permissions`. Поля те же, что у
        обновления своего примера, но статус модерации и данные утверждения не меняются.
        Для загрузки файлов отправляйте `POST` с полем `_method=PATCH`.
      operationId: updateShowcaseExampleAsModerator
      security:
        - clientSession: []
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ShowcaseUpdateExampleRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ShowcaseUpdateExampleRequestJson'
      responses:
        '200':
          description: Пример обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/showcase/moderation/examples/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/ShowcaseExampleId'

    post:
      tags: [Showcase moderation]
      summary: Утвердить пример
      description: |
        Устанавливает статус `approved`, время утверждения и текущего клиента как `approver`;
        после этого пример виден публично. Применимо к примеру в любом статусе.
        Требует запись в таблице `showcase_moderator_permissions`.
      operationId: approveShowcaseExample
      security:
        - clientSession: []
      responses:
        '200':
          description: Пример утверждён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/showcase/moderation/examples/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/ShowcaseExampleId'

    post:
      tags: [Showcase moderation]
      summary: Отклонить пример
      description: |
        Устанавливает статус `rejected`, очищает `approved_at` и сохраняет текущего клиента
        как `approver` (модератор, принявший решение). Применимо к примеру в любом статусе.
        Требует запись в таблице `showcase_moderator_permissions`.
      operationId: rejectShowcaseExample
      security:
        - clientSession: []
      responses:
        '200':
          description: Пример отклонён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseExampleResponse'
        '400':
          $ref: '#/components/responses/BusinessError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/real-projects:
    get:
      tags: [Real projects]
      operationId: listRealProjects
      summary: Проекты на Aizberg
      description: |
        Данные для блока «В реальных проектах». Проекты отсортированы по порядку,
        заданному в админке. `banner_url` — абсолютный URL баннера.
      responses:
        '200':
          description: Список проектов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealProjectsResponse'
              example:
                items:
                  - {name: Example Shop, banner_url: 'https://api.aizberg.ru/storage/real-projects/example-shop.svg', url: 'https://example-shop.com'}
                  - {name: Example Blog, banner_url: 'https://api.aizberg.ru/storage/real-projects/example-blog.svg', url: 'https://example-blog.com'}

components:
  securitySchemes:
    clientSession:
      type: apiKey
      in: cookie
      name: aizberg_session
      description: Cookie клиентской Laravel-сессии; фактическое имя может зависеть от конфигурации окружения.
  parameters:
    AjaxHeader: {name: X-Requested-With, in: header, required: true, schema: {type: string, enum: [XMLHttpRequest]}, description: Признак AJAX-запроса для middleware}
    CsrfHeader: {name: X-XSRF-TOKEN, in: header, required: false, schema: {type: string}, description: 'В production передайте URL-декодированное значение cookie XSRF-TOKEN из той же сессии. Альтернатива — X-CSRF-TOKEN с токеном сессии или поле _token в теле запроса. В тестовых окружениях проверка отключена.'}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    Search: {name: q, in: query, schema: {type: string, maxLength: 255}, description: Необязательная поисковая строка}
    RequiredSearch: {name: q, in: query, required: true, schema: {type: string, minLength: 2, maxLength: 255}}
    Locale: {name: locale, in: query, schema: {type: string, maxLength: 16, pattern: '^[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})*$'}, example: ru}
    ModuleSlug: {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$'}}
    DocumentationSlug: {name: slug, in: path, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]+$'}}
    Category: {name: category, in: path, required: true, schema: {type: string}, description: URL-encoded название категории}
    ModuleId: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    DocumentationId: {name: id, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    DocumentationIdNamed: {name: documentationId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    SectionId: {name: sectionId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    QuestionId: {name: questionId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {type: integer, format: int64, minimum: 1}}
    BlogSectionId:
      name: id
      in: path
      required: true
      description: ID раздела
      schema:
        type: integer
        format: int64
        minimum: 1

    BlogArticleId:
      name: id
      in: path
      required: true
      description: ID статьи
      schema:
        type: integer
        format: int64
        minimum: 1

    BlogCommentId:
      name: commentId
      in: path
      required: true
      description: ID комментария
      schema:
        type: integer
        format: int64
        minimum: 1

    ShowcaseCategoryId:
      name: id
      in: path
      required: true
      description: ID категории
      schema:
        type: integer
        format: int64
        minimum: 1

    ShowcaseExampleId:
      name: id
      in: path
      required: true
      description: ID примера сайта
      schema:
        type: integer
        format: int64
        minimum: 1

    ShowcaseModuleName:
      name: moduleName
      in: path
      required: true
      description: URL-encoded имя модуля CMS (точное совпадение)
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: Catalog
  requestBodies:
    EmailLogin:
      required: true
      content: {application/json: {schema: {type: object, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, minLength: 6, maxLength: 20, format: password}}}, example: {email: user@example.com, password: secret12}}}
    PhoneLogin:
      required: true
      content: {application/json: {schema: {type: object, required: [phone, password], properties: {phone: {type: string, pattern: '^\d{11,20}$'}, password: {type: string, minLength: 6, maxLength: 20, format: password}}}, example: {phone: '79991234567', password: secret12}}}
    MarketplaceModuleForm:
      required: true
      description: Multipart-форма. Для paid обязательны price и трёхбуквенный currency; GitHub URL должны вести на github.com. До 10 скриншотов JPG/PNG/WebP по 10 МБ, icon — JPG/PNG/GIF/WebP/SVG до 4 МБ, растровые уменьшаются до 112x112 px.
      content:
        multipart/form-data:
          schema: {$ref: '#/components/schemas/MarketplaceModuleWriteRequest'}
  responses:
    Success: {description: Операция выполнена, content: {application/json: {schema: {$ref: '#/components/schemas/SuccessResponse'}}}}
    LoginSuccess: {description: Вход выполнен; сервер устанавливает session cookie, content: {application/json: {schema: {$ref: '#/components/schemas/LoginResponse'}}}}
    LoginFailed: {description: Неверные реквизиты или клиент заблокирован, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
    Unauthorized: {description: Клиентская сессия отсутствует или истекла, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}, example: {message: Unauthenticated.}}}}
    ValidationError: {description: Ошибка проверки входных данных, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationError'}}}}
    BusinessError: {description: 'Ресурс не найден, не принадлежит клиенту, уже существует либо операция запрещена', content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
    NotFound: {description: Публичный ресурс не найден, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
    ApiDocSectionValidationError: {description: 'Ошибка валидации либо нарушение структуры дерева (родитель не найден, цикл, глубина больше 3)', content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/ValidationError'}, {$ref: '#/components/schemas/MessageResponse'}]}, example: {message: Документация поддерживает не более трёх уровней разделов.}}}}
    ModulePage: {description: Пагинированный список карточек, content: {application/json: {schema: {$ref: '#/components/schemas/ModulePageResponse'}}}}
  schemas:
    LicenseType:
      type: string
      enum: [MIT, Other, GPLv2, Apache 2.0, GPLv3, BSD 3-Clause, Unlicense, BSD 2-Clause, LGPLv3, AGPLv3]
    MessageResponse:
      type: object
      required: [message]
      properties: {message: {type: string}}
    SuccessResponse:
      type: object
      properties: {message: {type: string, example: success}}
    GenericSuccess:
      type: object
      description: Стандартная успешная JSON-обёртка приложения; дополнительные поля зависят от операции.
      additionalProperties: true
      properties: {message: {type: string, example: success}}
    ValidationError:
      type: object
      required: [message, errors]
      properties:
        message: {type: string, example: The given data was invalid.}
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
    RedirectResponse:
      type: object
      required: [message, redirect_to]
      properties: {message: {type: string, example: success}, redirect_to: {type: string}}
    LoginResponse:
      allOf:
        - {$ref: '#/components/schemas/RedirectResponse'}
        - {type: object, required: [session_id], properties: {session_id: {type: string, description: Идентификатор созданной сессии}}}
    RegistrationRequest:
      type: object
      required: [first_name, last_name, email, phone, country_code, city_id, password, password_confirmation, timezone]
      properties:
        first_name: {type: string, minLength: 2, maxLength: 60}
        last_name: {type: string, minLength: 2, maxLength: 60}
        email: {type: string, format: email, maxLength: 100, description: Уникальный email}
        phone: {type: string, pattern: '^\d{11,20}$', description: Уникальный телефон}
        country_code: {type: string, minLength: 2, maxLength: 2}
        city_id: {type: integer, minimum: 1}
        password: {type: string, format: password, minLength: 6, maxLength: 20}
        password_confirmation: {type: string, format: password}
        timezone: {type: string, example: Europe/Moscow}
        captcha: {type: string, description: Код с `/captcha/image`; обязателен при включённой серверной настройке и проверяется в той же cookie-сессии}
    RegistrationResponse:
      type: object
      required: [id, message, redirect_to]
      properties: {id: {type: integer, format: int64}, message: {type: string}, redirect_to: {type: string}}
    PasswordRecoveryFirstStepRequest:
      type: object
      description: Требуется хотя бы одно из полей email или phone; каждое переданное поле должно принадлежать зарегистрированному клиенту.
      anyOf:
        - required: [email]
        - required: [phone]
      properties:
        email: {type: string, format: email, description: Email зарегистрированного клиента; имеет приоритет при поиске клиента}
        phone: {type: string, pattern: '^\d{11,20}$', description: Телефон зарегистрированного клиента; используется для поиска при отсутствии email}
        captcha: {type: string, description: 'Код с `/captcha/image` из той же cookie-сессии; обязателен и проверяется, если `CAPTCHA_AT_EMAIL_RECOVERY` не равна `no`'}
    PasswordRecoverySecondStepRequest:
      type: object
      required: [code]
      properties:
        code:
          description: Шестизначный код восстановления; принимается как строка или целое число
          oneOf:
            - {type: string, pattern: '^\d{6}$'}
            - {type: integer, minimum: 100000, maximum: 999999}
    PasswordRecoveryThirdStepRequest:
      type: object
      required: [password, password_confirmation]
      properties:
        password: {type: string, format: password, minLength: 6, maxLength: 20}
        password_confirmation: {type: string, format: password, description: Должно совпадать с password}
    Client:
      type: object
      properties:
        id: {type: integer, format: int64}
        first_name: {type: string}
        last_name: {type: string}
        email: {type: string, format: email}
        phone: {type: string}
        country_code: {type: string}
        city_id: {type: integer}
        timezone: {type: string}
        is_blocked: {type: string, enum: [Y, N]}
        avatar_url: {type: string, format: uri, nullable: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true
    ProfileResponse: {type: object, required: [message, user], properties: {message: {type: string}, user: {$ref: '#/components/schemas/Client'}}}
    ProfileUpdateRequest:
      type: object
      minProperties: 1
      properties:
        first_name: {type: string, minLength: 2, maxLength: 60}
        last_name: {type: string, minLength: 2, maxLength: 60}
        email: {type: string, format: email, maxLength: 100}
        phone: {type: string, pattern: '^\d{11,20}$'}
        country_code: {type: string, minLength: 2, maxLength: 2}
        city_id: {type: integer, minimum: 1}
        timezone: {type: string}
      additionalProperties: false
    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties: {current_password: {type: string, format: password, minLength: 6, maxLength: 20}, password: {type: string, format: password, minLength: 6, maxLength: 20}, password_confirmation: {type: string, format: password}}
    MarketplaceModuleWriteRequest:
      type: object
      required: [display_name, install_slug, website_url, source_code_url, license_type, pricing_type, author_display_name, short_description, category, version, version_release_date]
      properties:
        display_name: {type: string, maxLength: 255}
        install_slug: {type: string, maxLength: 255, pattern: '^[a-zA-Z0-9_-]+$', description: Уникальный slug установки}
        website_url: {type: string, format: uri, maxLength: 1024}
        source_code_url: {type: string, format: uri, maxLength: 1024, description: URL на github.com}
        license_type: {$ref: '#/components/schemas/LicenseType'}
        license_url: {type: string, format: uri, nullable: true, description: URL на github.com}
        changelog_url: {type: string, format: uri, nullable: true, description: URL на github.com}
        pricing_type: {type: string, enum: [free, free_trial, paid]}
        price: {type: number, format: double, minimum: 0.01, maximum: 9999999999.99, nullable: true}
        currency: {type: string, pattern: '^[A-Z]{3}$', nullable: true, example: USD}
        author_display_name: {type: string, maxLength: 255}
        short_description: {type: string}
        category: {type: string, maxLength: 30}
        tags: {type: array, items: {type: string, maxLength: 100}}
        version: {type: string, maxLength: 64}
        version_release_date: {type: string, format: date}
        detailed_description: {type: string, nullable: true}
        icon: {type: string, format: binary}
        screenshots: {type: array, maxItems: 10, items: {type: string, format: binary}}
    ModuleListItem:
      type: object
      properties:
        id: {type: integer, format: int64}
        display_name: {type: string}
        install_slug: {type: string}
        author_display_name: {type: string}
        short_description: {type: string}
        category: {type: string}
        pricing_type: {type: string, enum: [free, free_trial, paid]}
        price: {type: string, nullable: true}
        currency: {type: string, nullable: true}
        icon_url: {type: string, format: uri, nullable: true}
        aggregate_rating: {type: number, format: float}
        ratings_count: {type: integer}
        views_count: {type: integer}
        is_favorite: {type: boolean}
      additionalProperties: true
    Module:
      allOf:
        - {$ref: '#/components/schemas/ModuleListItem'}
        - type: object
          properties:
            website_url: {type: string, format: uri}
            source_code_url: {type: string, format: uri}
            license_type: {$ref: '#/components/schemas/LicenseType'}
            license_url: {type: string, format: uri, nullable: true}
            changelog_url: {type: string, format: uri, nullable: true}
            detailed_description: {type: string, nullable: true}
            tags: {type: array, items: {type: string}}
            screenshots: {type: array, items: {type: object, additionalProperties: true}}
            versions: {type: array, items: {$ref: '#/components/schemas/Changelog'}}
            is_archived: {type: boolean}
            is_blocked: {type: boolean}
            is_favourite: {type: boolean, description: Только в публичной карточке}
    ModuleResponse:
      allOf:
        - {$ref: '#/components/schemas/Module'}
        - type: object
          required: [similar_modules]
          properties:
            similar_modules:
              type: array
              maxItems: 5
              items: {$ref: '#/components/schemas/SimilarModule'}
      description: Полная карточка возвращается непосредственно в корне JSON без дополнительного поля data.
    SimilarModule:
      type: object
      required: [id, icon_url, display_name, short_description, install_slug]
      properties:
        id: {type: integer, format: int64}
        icon_url: {type: string, format: uri, nullable: true}
        display_name: {type: string}
        short_description: {type: string}
        install_slug: {type: string}
    ModuleMutationResponse: {type: object, required: [module], properties: {message: {type: string}, id: {type: integer}, install_slug: {type: string}, module: {$ref: '#/components/schemas/Module'}}}
    ModulePageResponse:
      type: object
      properties:
        message: {type: string}
        items: {type: array, items: {$ref: '#/components/schemas/ModuleListItem'}}
        current_page: {type: integer}
        last_page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        sort: {type: string}
        order: {type: string}
      additionalProperties: true
    CreatedActivityResponse: {type: object, properties: {message: {type: string}, id: {type: integer}, created_at: {type: string, format: date-time}, updated_at: {type: string, format: date-time}}}
    ChangelogRequest: {type: object, required: [version, changes], properties: {version: {type: string, maxLength: 64}, changes: {type: array, minItems: 1, items: {type: string, maxLength: 2000}}, release_date: {type: string, format: date, nullable: true}}}
    Changelog: {type: object, properties: {version: {type: string}, changes: {type: array, items: {type: string}}, release_date: {type: string, format: date-time}}}
    TranslationMap:
      type: object
      description: Словарь «код языка → строка»; ключ соответствует шаблону locale.
      minProperties: 1
      additionalProperties: {type: string}
      example: {ru: Текст, en: Text}
    ApiDocJsonSchema:
      description: Произвольная JSON Schema в форме JSON-объекта или массива; модуль сохраняет её без интерпретации.
      oneOf:
        - {type: object, additionalProperties: true}
        - {type: array, items: {}}
    ApiDocJsonContainer:
      description: Произвольный JSON-объект или массив.
      nullable: true
      oneOf:
        - {type: object, additionalProperties: true}
        - {type: array, items: {}}
    ApiDocCreateRequest:
      type: object
      required: [slug, name, short_description]
      properties:
        slug: {type: string, maxLength: 255, pattern: '^[a-zA-Z0-9_-]+$', description: 'Уникален глобально; значения `manage` и `search` запрещены.', example: seller-api}
        name: {$ref: '#/components/schemas/TranslationMap'}
        short_description: {$ref: '#/components/schemas/TranslationMap'}
        tags: {type: array, nullable: true, maxItems: 50, uniqueItems: true, items: {type: string, maxLength: 100}}
        default_locale: {type: string, maxLength: 16, pattern: '^[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})*$', description: 'По умолчанию — локаль приложения. В `name` должен быть перевод для этой локали.', example: ru}
        is_published: {type: boolean, default: true}
      example:
        slug: seller-api
        name: {ru: API продавца, en: Seller API}
        short_description: {ru: Интеграция магазина с площадкой, en: Marketplace integration}
        tags: [seller, orders]
        default_locale: ru
        is_published: true
    ApiDocUpdateRequest:
      type: object
      minProperties: 1
      description: Все поля необязательные; передаются только изменяемые.
      properties:
        slug: {type: string, maxLength: 255, pattern: '^[a-zA-Z0-9_-]+$'}
        name: {$ref: '#/components/schemas/TranslationMap'}
        short_description: {$ref: '#/components/schemas/TranslationMap'}
        tags: {type: array, maxItems: 50, uniqueItems: true, items: {type: string, maxLength: 100}}
        default_locale: {type: string, maxLength: 16, pattern: '^[A-Za-z]{2,3}(?:[-_][A-Za-z0-9]{2,8})*$'}
        is_published: {type: boolean}
    ApiDocSummary:
      type: object
      description: Карточка документации в публичной выдаче; переводимые поля — строки на выбранной локали.
      required: [id, slug, name, short_description, tags, locale, default_locale, is_published, updated_at]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        name: {type: string, nullable: true}
        short_description: {type: string, nullable: true}
        tags: {type: array, items: {type: string}}
        locale: {type: string, description: 'Фактическая локаль выдачи: запрошенная `locale`, если перевод есть, иначе `default_locale`.'}
        default_locale: {type: string}
        is_published: {type: boolean}
        updated_at: {type: string, format: date-time, nullable: true}
    ApiDocManageSummary:
      description: Карточка документации владельца; переводимые поля — словари переводов, `locale` всегда null.
      allOf:
        - $ref: '#/components/schemas/ApiDocSummary'
        - type: object
          properties:
            name: {$ref: '#/components/schemas/TranslationMap'}
            short_description: {$ref: '#/components/schemas/TranslationMap'}
            locale: {type: string, nullable: true, example: null}
    ApiDocPageMeta:
      type: object
      required: [current_page, last_page, per_page, total]
      properties:
        current_page: {type: integer, minimum: 1}
        last_page: {type: integer, minimum: 1}
        per_page: {type: integer, minimum: 1, example: 20}
        total: {type: integer, minimum: 0}
    ApiDocPublicPage:
      description: Страница опубликованных документаций, сортировка по updated_at по убыванию.
      allOf:
        - $ref: '#/components/schemas/ApiDocPageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ApiDocSummary'}}
    ApiDocManagePage:
      description: Страница документаций текущего клиента (включая черновики), сортировка по updated_at по убыванию.
      allOf:
        - $ref: '#/components/schemas/ApiDocPageMeta'
        - type: object
          required: [items]
          properties:
            items: {type: array, items: {$ref: '#/components/schemas/ApiDocManageSummary'}}
    ApiDocPublic:
      description: Опубликованная документация с деревом разделов, локализованная на одну локаль.
      allOf:
        - $ref: '#/components/schemas/ApiDocSummary'
        - type: object
          required: [available_locales, sections, created_at]
          properties:
            available_locales: {type: array, items: {type: string}, description: 'Локали из `name` документации и `title` разделов, по алфавиту.', example: [en, ru]}
            sections: {type: array, items: {$ref: '#/components/schemas/ApiDocSectionPublic'}, description: Корневые разделы; вложенные — в children.}
            created_at: {type: string, format: date-time, nullable: true}
    ApiDocManage:
      description: Документация для редактирования; все переводимые поля — словари переводов.
      allOf:
        - $ref: '#/components/schemas/ApiDocManageSummary'
        - type: object
          required: [available_locales, sections, created_at]
          properties:
            available_locales: {type: array, items: {type: string}}
            sections: {type: array, items: {$ref: '#/components/schemas/ApiDocSectionManage'}}
            created_at: {type: string, format: date-time, nullable: true}
    ApiDocCreatedResponse:
      type: object
      required: [id, slug, documentation]
      properties:
        id: {type: integer, format: int64}
        slug: {type: string}
        documentation: {$ref: '#/components/schemas/ApiDocManage'}
    ApiDocUpdatedResponse:
      type: object
      required: [documentation]
      properties:
        documentation: {$ref: '#/components/schemas/ApiDocManage'}
    ApiDocEndpoint:
      type: object
      nullable: true
      required: [method, url]
      properties:
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE], description: Регистр при записи не важен — сохраняется в верхнем регистре.}
        url: {type: string, maxLength: 2048, example: /v1/orders}
    ApiDocRequestBody:
      type: object
      nullable: true
      required: [content_type]
      properties:
        content_type: {type: string, maxLength: 255, example: application/json}
        schema: {$ref: '#/components/schemas/ApiDocJsonSchema'}
    ApiDocParameterInput:
      type: object
      required: [name, required, description, type]
      properties:
        name: {type: string, maxLength: 255}
        location: {type: string, nullable: true, enum: [query, path, header, cookie, body], description: 'Только для `request_parameters`.'}
        required: {type: boolean}
        description: {$ref: '#/components/schemas/TranslationMap'}
        type: {type: string, maxLength: 100, example: string}
        example: {nullable: true, description: Произвольное JSON-значение}
    ApiDocParameterPublic:
      allOf:
        - $ref: '#/components/schemas/ApiDocParameterInput'
        - type: object
          properties:
            description: {type: string, nullable: true}
    ApiDocResponseInput:
      type: object
      required: [status_code, name, description, type]
      description: 'Повторяющиеся `status_code` разрешены — так задаются несколько вариантов ответа с одним HTTP-кодом.'
      properties:
        status_code: {type: string, pattern: '^(default|[1-5][0-9]{2})$', example: '200'}
