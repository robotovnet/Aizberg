openapi: "3.0.3"
info:
  title: Aizberg Public and Marketplace API
  version: 1.0.0
  description: |
    Спецификация содержит только клиентскую авторизацию, восстановление пароля и профиль, справочники стран/городов,
    Marketplace Modules API, Api Documentation API, Blogs API и Showcase API. Защищённые операции используют cookie
    Laravel-сессии. Маршруты `/clients`, `/cities` и `/countries` проходят middleware `ajax`;
    клиент должен отправлять `X-Requested-With: XMLHttpRequest`.

    Blogs API (`/api/blogs`) включает разделы, статьи, комментарии и ответы.
    Публичное чтение доступно без авторизации. Создавать статьи и комментарии может
    любой авторизованный клиент; изменять, удалять и архивировать статьи, а также
    изменять и удалять комментарии — их автор или модератор (`blog_moderator_permissions`).
    Управление разделами доступно клиентам из `blog_section_permissions`.
    Защищённые методы Blogs используют `web` + `api` + `auth:client`; для JSON-ответа
    при ошибке авторизации передавайте `Accept: application/json`. CSRF-токен для Blogs
    не требуется. Ошибки бизнес-логики, включая отсутствие ресурса или прав, возвращают
    HTTP 400, ошибки валидации — HTTP 422, отсутствие клиентской сессии — HTTP 401.

    Showcase API (`/api/showcase`) — каталог примеров сайтов на Aizberg: категории,
    скриншоты, список использованных модулей CMS и модерация. Публичное чтение доступно
    без авторизации и возвращает только примеры со статусом `approved`. Добавить пример
    может любой авторизованный клиент; новый пример получает статус `pending`. Автор может
    редактировать свой пример только в статусах `pending` и `rejected`, после чего статус
    снова становится `pending`. Управление категориями и модерация доступны клиентам из
    `showcase_moderator_permissions`. Защищённые методы Showcase используют `web` + `api` +
    `auth:client`; CSRF-токен не требуется. Коды ошибок совпадают с Blogs API.

    Real Projects API (`/api/real-projects`) — публичный список проектов, в которых
    используется Aizberg (блок «В реальных проектах»): название, ссылка на сайт и баннер.
    Проекты добавляются в админке (Настройки → Справочники → В проектах).
servers:
  - url: https://api.aizberg.ru
    description: Production
tags:
  - {name: Client authentication, description: 'Регистрация, вход, выход и восстановление пароля клиента'}
  - {name: Client profile, description: Чтение и изменение профиля текущего клиента}
  - {name: Dictionaries, description: Публичные справочники стран и городов}
  - {name: Marketplace public, description: Публичный каталог модулей}
  - {name: Marketplace account, description: 'Избранное, покупки и активность клиента'}
  - {name: Marketplace seller, description: Публикация и сопровождение модулей продавцом}
  - {name: Marketplace community, description: 'Вопросы, отзывы и оценки'}
  - {name: Marketplace moderation, description: Блокировка модулей модераторами}
  - {name: API docs public, description: Публичный каталог API-документаций}
  - {name: API docs management, description: Управление документациями владельца}
  - {name: API docs sections, description: Управление деревом разделов документации}
  - {name: Blogs sections, description: Разделы блога с вложенностью до двух уровней}
  - {name: Blogs articles, description: 'Статьи блога — публикация, редактирование и архивирование'}
  - {name: Blogs comments, description: Комментарии к статьям и ответы}
  - {name: Showcase categories, description: Категории примеров сайтов}
  - {name: Showcase examples, description: Публичный каталог утверждённых примеров сайтов}
  - {name: Showcase my examples, description: Добавление и редактирование примеров текущим клиентом}
  - {name: Showcase moderation, description: Очередь модерации и операции модератора}
  - {name: Real projects, description: Проекты на Aizberg для блока «В реальных проектах»}

paths:
  /clients/registration:
    post:
      tags: [Client authentication]
      operationId: registerClient
      summary: Зарегистрировать клиента
      description: Создаёт учётную запись. Пароль подтверждается полем `password_confirmation`. Если серверная настройка каптчи включена, передайте `captcha` с кодом, показанным на `/captcha/image`. Сначала запросите изображение, затем отправьте регистрацию с той же cookie-сессией. Код одноразовый; после любой ошибки валидации получите новое изображение.
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegistrationRequest'}
            example: {first_name: Иван, last_name: Иванов, email: user@example.com, phone: '79991234567', country_code: ru, city_id: 1, password: secret12, password_confirmation: secret12, timezone: Europe/Moscow, captcha: A7B2}
      responses:
        '200': {description: Клиент зарегистрирован, content: {application/json: {schema: {$ref: '#/components/schemas/RegistrationResponse'}}}}
        '422': {$ref: '#/components/responses/ValidationError'}
  /captcha/image:
    get:
      tags: [Client authentication]
      operationId: getRegistrationCaptcha
      summary: Получить изображение каптчи
      description: Возвращает PNG и сохраняет ожидаемый код в cookie-сессии. Используйте cookie из ответа при отправке `/clients/registration` или `/clients/password-recovery/by-email/first-step`. Для обновления запрашивайте этот URL повторно; код одноразовый.
      parameters:
        - {name: _, in: query, required: false, description: Параметр для обхода кэша, schema: {type: string}, example: '1727514000000'}
      responses:
        '200': {description: Изображение каптчи, content: {image/png: {schema: {type: string, format: binary}}}}
  /clients/login-by-email:
    post:
      tags: [Client authentication]
      operationId: loginClientByEmail
      summary: Войти по email
      description: Создаёт клиентскую сессию. Ограничение — 5 попыток в минуту. Заблокированный пользователь и неверные данные дают HTTP 400.
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      requestBody: {$ref: '#/components/requestBodies/EmailLogin'}
      responses:
        '200': {$ref: '#/components/responses/LoginSuccess'}
        '400': {$ref: '#/components/responses/LoginFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Превышен лимит попыток входа}
  /clients/login-by-phone:
    post:
      tags: [Client authentication]
      operationId: loginClientByPhone
      summary: Войти по телефону
      description: Телефон содержит только 11–20 цифр. Создаёт cookie-сессию; ограничение — 5 попыток в минуту.
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      requestBody: {$ref: '#/components/requestBodies/PhoneLogin'}
      responses:
        '200': {$ref: '#/components/responses/LoginSuccess'}
        '400': {$ref: '#/components/responses/LoginFailed'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {description: Превышен лимит попыток входа}
  /clients/password-recovery/by-email/first-step:
    post:
      tags: [Client authentication]
      operationId: startClientPasswordRecoveryByEmail
      summary: Отправить код восстановления пароля на email
      description: |
        Первый шаг восстановления пароля. Передайте email зарегистрированного клиента либо его phone
        (11–20 цифр). Если переданы оба поля, оба проверяются, а клиент выбирается по email.
        Шестизначный код отправляется на email найденного клиента; код и ID клиента сохраняются
        в cookie-сессии. Повторный вызов создаёт новый код и сбрасывает счётчик попыток и подтверждение кода.

        Каптча обязательна, если настройка `CAPTCHA_AT_EMAIL_RECOVERY` не равна `no`.
        Сначала получите `/captcha/image`, затем передайте `captcha` в той же cookie-сессии.
        После ошибки валидации получите новое изображение. При отключённой каптче поле не проверяется.
        Все три шага выполняйте с одной cookie-сессией; предварительный вход не требуется.
        В production требуется CSRF-токен этой сессии.
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordRecoveryFirstStepRequest'}
            example: {email: user@example.com, captcha: A7B2}
      responses:
        '200': {description: Код отправлен на email клиента, content: {application/json: {schema: {$ref: '#/components/schemas/RedirectResponse'}, example: {message: success, redirect_to: /clients/password-recovery/second-step}}}}
        '419': {description: CSRF-токен отсутствует или не соответствует сессии}
        '422': {$ref: '#/components/responses/ValidationError'}
  /clients/password-recovery/second-step:
    post:
      tags: [Client authentication]
      operationId: verifyClientPasswordRecoveryCode
      summary: Проверить код восстановления пароля
      description: |
        Второй шаг восстановления пароля. Передайте шестизначный код из письма или SMS
        с cookie-сессией первого шага. В production требуется CSRF-токен этой сессии.
        Количество попыток задаётся `client.max_code_entry_attempts` (по умолчанию 10).
        Каждый запрос, прошедший валидацию, учитывается как попытка. Неверный код, отсутствие кода
        в сессии или превышение лимита возвращают HTTP 400. Для получения нового кода и сброса
        лимита повторите первый шаг. При успехе код и счётчик попыток удаляются, а в сессии
        сохраняется разрешение на установку нового пароля.
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordRecoverySecondStepRequest'}
            example: {code: '123456'}
      responses:
        '200': {description: Код подтверждён, content: {application/json: {schema: {$ref: '#/components/schemas/RedirectResponse'}, example: {message: success, redirect_to: /clients/password-recovery/third-step}}}}
        '400': {description: Код неверен или отсутствует в сессии либо превышен лимит попыток, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
        '419': {description: CSRF-токен отсутствует или не соответствует сессии}
        '422': {$ref: '#/components/responses/ValidationError'}
  /clients/password-recovery/third-step:
    post:
      tags: [Client authentication]
      operationId: completeClientPasswordRecovery
      summary: Установить новый пароль после проверки кода
      description: |
        Третий шаг восстановления пароля. Выполняется после успешной проверки кода во втором шаге
        с той же cookie-сессией. В production требуется CSRF-токен этой сессии.
        Новый пароль должен содержать 6–20 символов и совпадать с `password_confirmation`.
        Если в сессии нет подтверждения кода или ID клиента, возвращается HTTP 400.
        После смены пароля ID клиента и подтверждение кода удаляются из сессии.
        Метод возвращает `redirect_to: /clients/login`; автоматический вход не выполняется.
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}, {$ref: '#/components/parameters/CsrfHeader'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordRecoveryThirdStepRequest'}
            example: {password: newSecret12, password_confirmation: newSecret12}
      responses:
        '200': {description: Пароль изменён, content: {application/json: {schema: {$ref: '#/components/schemas/RedirectResponse'}, example: {message: success, redirect_to: /clients/login}}}}
        '400': {description: Пароль не изменён — код не подтверждён или ID клиента отсутствует в сессии, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}, example: {message: Пароль не был изменен.}}}}
        '419': {description: CSRF-токен отсутствует или не соответствует сессии}
        '422': {$ref: '#/components/responses/ValidationError'}
  /clients/logout:
    post:
      tags: [Client authentication]
      operationId: logoutClient
      summary: Завершить клиентскую сессию
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      responses:
        '200': {description: Сессия завершена, content: {application/json: {schema: {$ref: '#/components/schemas/RedirectResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /clients/profile:
    get:
      tags: [Client profile]
      operationId: getClientProfile
      summary: Получить профиль текущего клиента
      description: Возвращает модель клиента без password, remember_token и внутренней связи userpic; добавляет публичный `avatar_url`.
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      responses:
        '200': {description: Профиль, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Client profile]
      operationId: updateClientProfile
      summary: Частично изменить профиль
      description: Нужно передать хотя бы одно поддерживаемое поле. Телефон очищается от нецифровых символов, код страны приводится к нижнему регистру; уникальность email/телефона проверяется без учёта текущего клиента.
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProfileUpdateRequest'}}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /clients/change_password:
    post:
      tags: [Client profile]
      operationId: changeClientPassword
      summary: Изменить пароль
      description: Проверяет текущий пароль и сохраняет новый. Новый пароль подтверждается `password_confirmation`.
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/AjaxHeader'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ChangePasswordRequest'}, example: {current_password: oldSecret, password: newSecret, password_confirmation: newSecret}}}
      responses:
        '200': {$ref: '#/components/responses/Success'}
        '400': {description: Текущий пароль неверен, content: {application/json: {schema: {$ref: '#/components/schemas/MessageResponse'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
  /cities/{country_code}/all:
    post:
      tags: [Dictionaries]
      operationId: listCitiesByCountry
      summary: Получить города страны
      description: Возвращает пагинированный список городов по двухбуквенному коду страны.
      parameters:
        - {$ref: '#/components/parameters/AjaxHeader'}
        - {name: country_code, in: path, required: true, schema: {type: string, minLength: 2, maxLength: 2}, example: ru}
        - {$ref: '#/components/parameters/Page'}
      responses:
        '200': {description: Список городов, content: {application/json: {schema: {$ref: '#/components/schemas/GenericSuccess'}}}}
  /countries/all:
    get:
      tags: [Dictionaries]
      operationId: listCountries
      summary: Получить страны
      parameters:
        - {$ref: '#/components/parameters/AjaxHeader'}
        - {name: withcities, in: query, description: Значение `Y` включает города, schema: {type: string, enum: [Y, N], default: N}}
        - {name: search, in: query, schema: {type: string, nullable: true}, description: Поиск по справочнику}
      responses:
        '200': {description: Список стран, content: {application/json: {schema: {$ref: '#/components/schemas/GenericSuccess'}}}}

  /api/marketplace-modules/search:
    get:
      tags: [Marketplace public]
      operationId: searchMarketplaceModules
      summary: Найти публичные модули
      description: Ищет только неархивированные и незаблокированные модули. Фильтры применяются совместно (AND); пустые значения игнорируются. Сортировка аналогична списку категории; ответ включает sort и order. Каждый успешный вызов с непустым q увеличивает счётчик запроса, включая пагинацию и поиск без результатов. Для статистики регистр и лишние пробелы игнорируются.
      parameters:
        - {$ref: '#/components/parameters/Search'}
        - {$ref: '#/components/parameters/Page'}
        - {name: category, in: query, schema: {type: string}, description: Название категории без учёта регистра}
        - {name: license_type, in: query, schema: {$ref: '#/components/schemas/LicenseType'}, description: Точный тип лицензии, example: MIT}
        - {name: pricing_type, in: query, schema: {type: string, enum: [free, free_trial, paid]}, description: Тип оплаты}
        - {name: sort, in: query, schema: {type: string, default: date_added, enum: [date_added, date_updated, rating, popularity, name, pricing]}}
        - {name: order, in: query, schema: {type: string, default: desc, enum: [asc, desc]}}
      responses: {'200': {$ref: '#/components/responses/ModulePage'}}
  /api/marketplace-modules/popular-searches:
    get:
      tags: [Marketplace public]
      operationId: getPopularMarketplaceSearches
      summary: Получить 10 самых популярных поисковых запросов
      description: Возвращает до 10 запросов за всё время по убыванию searches_count; при равном счётчике первыми идут ранее сохранённые запросы. Текст приведён к нижнему регистру, пробельные последовательности заменены одним пробелом, пробелы по краям удалены. При отсутствии статистики items пуст.
      responses:
        '200':
          description: Популярные поисковые запросы
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 10
                    items:
                      type: object
                      required: [query, searches_count]
                      properties:
                        query: {type: string, example: seo}
                        searches_count: {type: integer, format: int64, minimum: 1, example: 42}
  /api/marketplace-modules/featured:
    get:
      tags: [Marketplace public]
      operationId: getFeaturedMarketplaceModules
      summary: Получить тематические подборки
      responses: {'200': {description: Подборки модулей, content: {application/json: {schema: {$ref: '#/components/schemas/GenericSuccess'}}}}}
  /api/marketplace-modules/categories:
    get:
      tags: [Marketplace public]
      operationId: listMarketplaceCategories
      summary: Получить категории
      responses: {'200': {description: Категории с количеством модулей и иконками, content: {application/json: {schema: {$ref: '#/components/schemas/GenericSuccess'}}}}}
  /api/marketplace-modules/categories/{category}:
    get:
      tags: [Marketplace public]
      operationId: listMarketplaceModulesByCategory
      summary: Получить модули категории
      parameters:
        - {$ref: '#/components/parameters/Category'}
        - {$ref: '#/components/parameters/Page'}
        - {name: sort, in: query, schema: {type: string, default: date_added, enum: [date_added, date_updated, rating, popularity, name, pricing]}}
        - {name: order, in: query, schema: {type: string, default: desc, enum: [asc, desc]}}
      responses: {'200': {$ref: '#/components/responses/ModulePage'}}
  /api/marketplace-modules/modules/{slug}:
    get:
      tags: [Marketplace public]
      operationId: getMarketplaceModule
      summary: Получить полную карточку модуля
      description: Публичный метод; при наличии клиентской сессии также вычисляет `is_favourite`. Поле `similar_modules` содержит до 5 случайных модулей из той же категории, без текущего, удалённых, архивных и заблокированных модулей.
      parameters: [{$ref: '#/components/parameters/ModuleSlug'}]
      responses:
        '200': {description: Карточка модуля, content: {application/json: {schema: {$ref: '#/components/schemas/ModuleResponse'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/marketplace-modules/modules/{slug}/questions:
    get:
      tags: [Marketplace public]
      operationId: listModuleQuestions
      summary: Получить вопросы и ответы
      parameters: [{$ref: '#/components/parameters/ModuleSlug'}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Пагинированные вопросы с ответами, content: {application/json: {schema: {$ref: '#/components/schemas/GenericSuccess'}}}}}
    post:
      tags: [Marketplace community]
      operationId: askModuleQuestion
      summary: Задать вопрос
      security: [{clientSession: []}]
      parameters: [{$ref: '#/components/parameters/ModuleSlug'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [question_text], properties: {question_text: {type: string, maxLength: 20000}}}}}}
      responses: {'200': {description: Вопрос создан, content: {application/json: {schema: {$ref: '#/components/schemas/CreatedActivityResponse'}}}}, '400': {$ref: '#/components/responses/BusinessError'}, '401': {$ref: '#/components/responses/Unauthorized'}, '422': {$ref: '#/components/responses/ValidationError'}}
  /api/marketplace-modules/modules/{slug}/reviews:
    get:
      tags: [Marketplace public]
      operationId: listModuleReviews
      summary: Получить отзывы и оценки
      parameters: [{$ref: '#/components/parameters/ModuleSlug'}, {$ref: '#/components/parameters/Page'}]
      responses: {'200': {description: Пагинированные отзывы, content: {application/json: {schema: {$ref: '#/components/schemas/GenericSuccess'}}}}}
    post:
      tags: [Marketplace community]
      operationId: upsertModuleReview
