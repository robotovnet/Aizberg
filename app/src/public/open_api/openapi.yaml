        name:
          type: string
          minLength: 1
          maxLength: 255
        short_description:
          type: string
          minLength: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
          description: ID существующей категории
        modules:
          type: array
          minItems: 1
          description: Имена модулей CMS; значения обрезаются по краям, повторы удаляются.
          items:
            type: string
            maxLength: 100

    ShowcaseStoreExampleRequest:
      allOf:
        - $ref: '#/components/schemas/ShowcaseStoreExampleRequestJson'
        - type: object
          properties:
            images:
              type: array
              nullable: true
              description: |
                Скриншоты (Laravel-правило `image`, до 4096 КБ каждый). Сохраняется не более
                `SHOWCASE_MAX_IMAGES` (по умолчанию 10) изображений, лишние файлы отбрасываются.
              items:
                type: string
                format: binary

    ShowcaseUpdateExampleRequestJson:
      type: object
      properties:
        website_url:
          type: string
          format: uri
          maxLength: 512
        name:
          type: string
          minLength: 1
          maxLength: 255
        short_description:
          type: string
          minLength: 1
        category_id:
          type: integer
          format: int64
          minimum: 1
          description: ID существующей категории
        modules:
          type: array
          minItems: 1
