log_errors = On
log_errors_max_len = 1024
error_reporting = E_ALL
error_log = /var/log/php/errors.log
display_errors = On
display_startup_errors = On
session.save_path = "/var/lib/php/sessions"
upload_max_filesize = 16M
post_max_size = 16M
expose_php = Off
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
disable_functions = mail,expect_popen,pcntl_exec,eval,passthru,exec,system,chroot,scandir,chgrp,chown,shell_exec,ini_alter,ini_alter,ini_restore,dl,pfsockopen,openlog,syslog,readlink,symlink,popepassthru,stream_socket_server,get_current_user,leak,putenv,popen
memory_limit=256M
